# SmartHome 工程 SDK 拉取配置
# 用法: python <SDK>/tools/sync_lib.py User/sdk.toml
# 显式选择的模块；depends 闭包由脚本自动补全（如 chip.platform）
# 本文件与 board_cfg.h 同置于 User/（均为工程侧资产，不会被 sync 覆盖）；
# dest 用 ../MySDK 使生成目录仍落在工程根（根 CMakeLists 的 add_subdirectory(MySDK) 不动）。

sdk       = "C:/Container/Library/mysdk-stm32"
dest      = "../MySDK/library"    # 库落点（相对 User/）→ 工程根 MySDK/library；根 CMakeLists 以 add_subdirectory(MySDK/library) 接入
board_cfg = "board_cfg.h"
tools_dir = "../tools"              # host 工具落点（相对 dest）→ MySDK/tools，与 library 同级，随工程入库

[modules]
# ---- chip：MCU 片上外设 OOP 封装 ----
"chip.oop_dwt"   = true   # DWT 微秒延时
"chip.oop_gpio"  = true   # GPIO 抽象（含中断回调）
"chip.oop_uart"  = true   # UART 驱动（hlk-rm58s 用）
"chip.oop_tim"   = true   # TIM OOP 封装（ir_transmitter 载波 / ir_receiver 节拍）
"chip.oop_iwdg"  = true   # IWDG OOP 封装（heart_beat 喂狗）
"chip.platform"  = true   # HAL 统一入口（系列宏）

# ---- devices：板载外挂器件 ----
"devices.dht11"      = true   # 温湿度（task_temperature）
"devices.heart_beat" = true   # 心跳 LED（app）
"devices.hlk_rm58s"  = true   # WiFi 模组（task_wifi）
"devices.ir_receiver"    = true   # 红外接收
"devices.ir_transmitter" = true   # 红外发射
"devices.lan8720a"   = true   # ETH PHY 复位（app）

# ---- protocols：协议/算法 ----
"protocols.ac_codec" = true   # 空调红外编码（task_ir）
"protocols.mqtt"     = true   # MQTT 客户端（task_mqtt / business_mqtt）
"protocols.wol"      = true   # Wake-on-LAN（business_mqtt）

[tools]
# host 工具按配置拉取到 MySDK/tools（随工程入库；SDK 搬走也能 Flash / 发固件）
"fw-flash"              = true   # flash：J-Link 烧录（自检路径/器件名，回写 settings.json）
"fw-ota-ymodem"         = true   # ymodem：发 raw .bin 给设备（设备侧自动选非运行槽）
"fw-ota-pack"           = true   # pack：bin -> .otapkg（raw-bin 流程下一般不用）
"format-gbk2utf8"       = true   # trans：GBK 源码转 UTF-8
"format-utf16be2utf8"   = true   # trans16：UTF-16 / BOM 归一化为 UTF-8
"gen-cmake-paths"       = true   # gencmake：扫描目录生成 CMake 源/包含路径片段
"check-eol"             = true   # audit 之一：行尾体检（CR 加倍/孤立 CR）
"sdk-check-oop"         = true   # audit 之一：HAL 泄漏红线（无 SDK 时审工程 MySDK/）
